name: Weekly nowcast

# fridays 14:00 UTC, after the 8:30 ET LFS release
on:
  schedule:
    - cron: "0 14 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-nowcast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt && pip install --no-deps -e .

      - name: Test
        run: python -m pytest -q

      # scraped from The Daily, so don't let a page change stop the run
      - name: GDP flash estimates
        continue-on-error: true
        run: python -m nowcast flash

      - name: Fetch data and save snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m nowcast fetch

      - name: Nowcast, news, append to history
        run: python -m nowcast update

      - name: Build page
        run: python -m nowcast report

      - name: Commit data and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output README.md
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Weekly update $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
