[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canada-gdp-nowcast"
version = "0.1.0"
description = "Self-updating nowcast of Canadian quarterly real GDP growth with a mixed-frequency dynamic factor model"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "requests",
    "pyyaml",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
